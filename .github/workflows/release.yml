# ⚠️ AUTO VERSIONING — DISABLED
# This workflow was creating infinite version bump loops on every push to main.
# To re-enable, uncomment the workflow and use manual triggers instead of push.
#
# To bump version manually, run from your terminal:
#   npm version patch -m "chore(release): bump version to %s"
#   git push --follow-tags

name: Auto Versioning (Disabled)

on:
  workflow_dispatch: # Manual trigger only — no more auto-bumps on push
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump_version:
    name: Bump Package Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        run: |
          npm version ${{ inputs.bump_type }} -m "chore(release): bump version to %s [skip ci]"

      - name: Push Version Bump
        run: git push --follow-tags

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build_and_lint_root:
    name: Build & Lint App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install App Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # Expo/React Native apps usually have custom build/lint commands.
      # We'll use a basic syntax check and expo export for validation.
      - name: Run ESLint (App)
        run: npm run lint

      - name: Test Build (Expo Export)
        run: npx expo export -p web
        continue-on-error: true # Not strictly necessary if web isn't fully configured

  build_and_lint_functions:
    name: Build & Lint Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./functions/package-lock.json"

      - name: Install Functions Dependencies
        run: npm ci || npm install

      - name: Run ESLint (Functions)
        run: npm run lint

      - name: Build TypeScript (Functions)
        run: npm run build

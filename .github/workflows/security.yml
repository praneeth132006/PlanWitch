name: Security Scans

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sundays

jobs:
  secret_scanning:
    name: Secrets & Credentials Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deep fetch for full history scan

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true # Security scans are advisory, not blocking

      # Gitleaks removed — requires paid license, TruffleHog covers the same checks

  dependency_scanning:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: NPM Audit (App)
        run: npm audit --audit-level=high || true # High/Critical only

      - name: NPM Audit (Functions)
        working-directory: ./functions
        run: npm audit --audit-level=high || true

      - name: Trivy FS Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"
        continue-on-error: true # RN projects have many transitive dep vulnerabilities
